name: Auto Scraper

# Kdy se má bot spustit
on:
  schedule:
    - cron: '0 */3 * * *' # Automaticky každé 3 hodiny
  workflow_dispatch: # Tlačítko pro manuální spuštění

# Co má bot udělat
jobs:
  stahni_auta:
    runs-on: ubuntu-latest

    steps:
      - name: Stáhni repozitář
        uses: actions/checkout@v4

      - name: Nastav Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Nainstaluj knihovny
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Spuštění bota
        env:
          # Tady si bot sáhne pro tajný klíč do tvého GitHub nastavení
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python scraper.py

      - name: Ulož nová data na web
        run: |
          git config --global user.name "Auto Bot"
          git config --global user.email "bot@tvuj-web.cz"
          git add data.json
          git commit -m "Aktualizace inzerátů [skip ci]" || echo "Žádné změny k uložení"
          git push
