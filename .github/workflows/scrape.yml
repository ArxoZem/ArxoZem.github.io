name: Auto Scraper

# Kdy se má robot spustit
on:
  schedule:
    - cron: '0 */3 * * *' # Každé 3 hodiny
  workflow_dispatch: # Povolí manuální tlačítko v záložce Actions

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Robot potřebuje práva k zápisu do repozitáře
      
    steps:
      - name: Stáhnutí repozitáře
        uses: actions/checkout@v3

      - name: Nastavení Pythonu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalace knihoven
        run: pip install requests beautifulsoup4

      - name: Spuštění bota
        run: python scraper.py

      - name: Uložení výsledků (Commit)
        run: |
          git config user.name "Auto Bot"
          git config user.email "action@github.com"
          git add data.json
          # Příkaz exit 0 zaručí, že to nespadne, když bot nenajde nová data
          git commit -m "Automatická aktualizace inzerátů" || exit 0
          git push
